name: Build and Push

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

jobs:
  build:
    permissions:
      contents: read
      packages: write
    env:
      PUSH_DOCKERHUB: ${{ secrets.DOCKERHUB_TOKEN != '' }}
    name: server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to DockerHub
        if: env.PUSH_DOCKERHUB == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate Tag List
        run: |
          echo "TAGS<<EOF" >> "$GITHUB_ENV"

          # OCI image names must be lowercase; GitHub owner casing varies by user
          OWNER_LC="${OWNER,,}"
          IMAGE_NAME="$OWNER_LC/floway-server"
          DATE="$(date +'%Y%m%d')"

          REGISTRIES=("ghcr.io/")
          if [ "$PUSH_DOCKERHUB" = "true" ]; then
              REGISTRIES=("" "ghcr.io/")
          fi

          for REGISTRY in "${REGISTRIES[@]}"; do
              echo "${REGISTRY}${IMAGE_NAME}:latest" >> "$GITHUB_ENV"
              echo "${REGISTRY}${IMAGE_NAME}:${DATE}.${RUN_ID}" >> "$GITHUB_ENV"
          done

          echo "EOF" >> "$GITHUB_ENV"
        env:
          RUN_ID: ${{ github.run_id }}
          OWNER: ${{ github.repository_owner }}
      - name: Build and Push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: server
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/riscv64
          push: true
          tags: ${{ env.TAGS }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,scope=server,mode=max
